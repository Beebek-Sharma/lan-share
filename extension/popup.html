<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LAN Share Launcher</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root, [data-theme="light"] {
      /* Liquid Glassmorphism Light Tokens (Screenshot 2 & 4) */
      --bg: #edf3f7;
      --surface: rgba(255, 255, 255, 0.75);
      --surface-hover: rgba(255, 255, 255, 0.95);
      --surface-card: rgba(255, 255, 255, 0.82);
      --border: rgba(255, 255, 255, 0.95);
      --border-strong: rgba(255, 255, 255, 0.8);
      --pine-input: rgba(255, 255, 255, 0.85);
      --emerald: linear-gradient(135deg, #10b981 0%, #059669 100%);
      --emerald-hover: linear-gradient(135deg, #059669 0%, #047857 100%);
      --emerald-light: #15803d;
      --emerald-text: #ffffff;
      --text: #1e293b;
      --heading: #0f172a;
      --text-muted: #64748b;
      --danger: #dc2626;
      --danger-border: rgba(239, 68, 68, 0.28);
      --danger-bg: rgba(254, 242, 242, 0.88);
      --danger-hover: #fee2e2;
      --radius-lg: 14px;
      --radius-md: 10px;
      --shadow-sm: -2px -2px 6px rgba(255, 255, 255, 0.9), 3px 4px 10px rgba(0, 0, 0, 0.05), inset 0 1px 1.5px #ffffff;
      --shadow-card: 0 8px 24px rgba(0, 0, 0, 0.04), inset 0 1.5px 2px #ffffff;
      --status-bg: rgba(255, 255, 255, 0.8);
      --font-main: 'Manrope', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'DM Mono', ui-monospace, SFMono-Regular, monospace;
    }

    [data-theme="dark"] {
      /* Stealth Matte Carbon & Obsidian Spatial Theme (Screenshot 3) */
      --bg: #111417;
      --surface: linear-gradient(145deg, #1d2127 0%, #15181d 100%);
      --surface-hover: linear-gradient(145deg, #242932 0%, #191c22 100%);
      --surface-card: linear-gradient(145deg, #1b1f25 0%, #14171d 100%);
      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.14);
      --pine-input: #0c0e11;
      --emerald: linear-gradient(145deg, #10b981 0%, #059669 100%);
      --emerald-hover: linear-gradient(145deg, #34d399 0%, #10b981 100%);
      --emerald-light: #34d399;
      --emerald-text: #04140e;
      --text: #f1f5f9;
      --heading: #ffffff;
      --text-muted: #94a3b8;
      --danger: #f87171;
      --danger-border: #641c23;
      --danger-bg: #2d0e12;
      --danger-hover: #45151c;
      --radius-lg: 14px;
      --radius-md: 10px;
      --shadow-sm: 4px 5px 12px rgba(0, 0, 0, 0.65), -2px -2px 6px rgba(255, 255, 255, 0.035);
      --shadow-card: 6px 8px 20px rgba(0, 0, 0, 0.7), -3px -3px 8px rgba(255, 255, 255, 0.035);
      --status-bg: #0c0e11;
      --font-main: 'Manrope', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'DM Mono', ui-monospace, SFMono-Regular, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 320px;
      padding: 18px;
      font-family: var(--font-main);
      background: var(--bg);
      color: var(--text);
      user-select: none;
      transition: background 0.2s, color 0.2s;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: var(--surface);
      border: 1px solid var(--border-strong);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-sm);
    }

    .brand-icon svg {
      width: 18px;
      height: 18px;
      fill: var(--emerald-light);
    }

    .title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.2px;
      color: var(--heading);
      line-height: 1.2;
    }

    .subtitle {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .theme-btn {
      appearance: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      padding: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    [data-theme="light"] .theme-btn {
      background: rgba(255, 255, 255, 0.85);
      border: 1.5px solid rgba(255, 255, 255, 0.98);
      color: #334155;
      box-shadow: -2px -2px 6px rgba(255, 255, 255, 0.9), 3px 4px 10px rgba(0, 0, 0, 0.05), inset 0 1px 1px #ffffff;
    }

    [data-theme="dark"] .theme-btn {
      background: #171c21;
      border: 1.5px solid rgba(52, 211, 153, 0.55);
      color: #ffffff;
      box-shadow: 0 0 10px rgba(52, 211, 153, 0.25), 4px 5px 12px rgba(0, 0, 0, 0.65), -2px -2px 6px rgba(255, 255, 255, 0.03);
    }

    .theme-btn:hover {
      transform: translateY(-1px) scale(1.08);
    }

    .theme-icon-svg {
      width: 16px;
      height: 16px;
      display: block;
      transition: transform 0.25s ease;
    }

    .theme-btn:hover .theme-icon-svg {
      transform: rotate(15deg);
    }

    .status-indicator {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      box-shadow: var(--shadow-sm);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #64748b;
      transition: all 0.3s ease;
    }

    .status-indicator.running {
      background: rgba(20, 99, 77, 0.08);
      border-color: rgba(20, 99, 77, 0.3);
      color: var(--emerald-light);
    }

    .status-indicator.running .status-dot {
      background: var(--emerald-light);
      box-shadow: 0 0 8px var(--emerald-light);
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(0.9); }
    }

    .ip-card {
      display: none;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 9px 12px;
      margin-bottom: 12px;
      font-size: 11.5px;
      box-shadow: var(--shadow-sm);
    }

    .ip-card.show {
      display: flex;
    }

    .ip-label {
      color: var(--text-muted);
      font-weight: 600;
    }

    .ip-val {
      color: var(--emerald-light);
      font-weight: 700;
      font-family: var(--font-mono);
    }

    .ip-copy {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 2px 5px;
      font-size: 13px;
      border-radius: 4px;
      transition: color 0.15s;
    }

    .ip-copy:hover {
      color: var(--text);
    }

    .port-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 8px 12px;
      margin-bottom: 12px;
      box-shadow: var(--shadow-sm);
    }

    .port-label {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
    }

    #port {
      background: var(--pine-input);
      border: 1px solid var(--border);
      outline: none;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 600;
      width: 72px;
      padding: 5px 8px;
      border-radius: 6px;
      text-align: right;
      transition: border-color 0.2s;
    }

    #port:focus {
      border-color: var(--emerald-light);
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    button.btn {
      appearance: none;
      border: none;
      outline: none;
      cursor: pointer;
      width: 100%;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 600;
      border-radius: var(--radius-md);
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s, transform 0.15s, border-color 0.15s, box-shadow 0.15s;
    }

    #startServer {
      background: var(--emerald);
      color: var(--emerald-text);
      font-weight: 700;
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 4px 14px rgba(23, 77, 61, 0.2);
    }

    #startServer:hover:not(:disabled) {
      background: var(--emerald-hover);
      transform: translateY(-1px);
    }

    #openApp {
      background: var(--surface);
      color: var(--emerald-light);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }

    #openApp:hover:not(:disabled) {
      background: var(--surface-hover);
      border-color: var(--border-strong);
      transform: translateY(-1px);
    }

    #stopServer {
      background: var(--danger-bg);
      color: var(--danger);
      border: 1px solid var(--danger-border);
    }

    #stopServer:hover:not(:disabled) {
      background: var(--danger-hover);
      transform: translateY(-1px);
    }

    button.btn:disabled {
      opacity: 0.38;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }

    #status {
      margin-top: 12px;
      padding: 8px 12px;
      background: var(--status-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      font-size: 11.5px;
      color: var(--text-muted);
      line-height: 1.35;
      min-height: 32px;
      display: flex;
      align-items: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14.5v-9l6 4.5-6 4.5z"/>
        </svg>
      </div>
      <div>
        <h1 class="title">LAN Share</h1>
        <p class="subtitle">Direct P2P File Transfer</p>
      </div>
    </div>
    <div class="header-actions">
      <button id="themeToggleBtn" class="theme-btn" title="Toggle Theme">☀️</button>
      <div id="serverBadge" class="status-indicator">
        <span class="status-dot"></span>
        <span id="badgeText">Offline</span>
      </div>
    </div>
  </div>

  <div id="ipCard" class="ip-card">
    <span class="ip-label">LAN:</span>
    <span id="ipDisplay" class="ip-val">http://...</span>
    <button id="copyIpBtn" class="ip-copy" title="Copy URL">📋</button>
  </div>

  <div class="port-box">
    <label class="port-label" for="port">Local Port</label>
    <input id="port" type="number" min="1" max="65535" value="5000">
  </div>

  <div class="actions">
    <button id="startServer" class="btn">
      <span>🚀</span> Start Server
    </button>
    <button id="openApp" class="btn" disabled>
      <span>🌐</span> Open Web App
    </button>
    <button id="stopServer" class="btn" disabled>
      <span>🛑</span> Stop Server
    </button>
  </div>

  <div id="status">Checking server status...</div>

  <script src="popup.js"></script>
</body>
</html>
